        * {

        body, html {

        .room-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Sửa lại đường dẫn trỏ thẳng vào thư mục chứa ảnh */

        }

        .profile-header {
            position: absolute;

            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .profile-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 7px;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.9),
                0 0 25px rgba(255, 200, 50, 0.7),
                0 4px 20px rgba(0, 0, 0, 0.95),
                0 10px 40px rgba(0, 0, 0, 0.9);

        }

        .profile-header p {
            font-size: 0.9rem;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
            text-shadow: 
                0 0 8px rgba(255, 215, 0, 0.8),
                0 2px 12px rgba(0, 0, 0, 0.95),
                0 4px 25px rgba(0, 0, 0, 0.85);
        }

        /* Container chứa các sợi dây trên băng chuyền 3D */
        .chains-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        .crystal-chain-wrapper {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transform-origin: top center;
            /* Vị trí, độ sâu, phối cảnh do JavaScript tính từng khung hình khi xoay vòng 3D */
            will-change: left, height, transform, filter, opacity;
        }

        /* Lớp bên trong chỉ lo đung đưa, để không đè lên transform xoay 3D của lớp ngoài */
        .chain-sway {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
        }

        /* Hiệu ứng đung đưa vật lý chân thực */
        @keyframes sway {
            0% { transform: rotate(-2.2deg); }
            100% { transform: rotate(2.2deg); }
        }

        .chain-sway.swaying {
            animation: sway 6s ease-in-out infinite alternate;
        }

        .crystal-chain-wrapper:hover .chain-sway {
            animation-play-state: paused;
        }

        /* Hiệu ứng nháy sáng ngẫu nhiên tự nhiên cho từng sợi dây */
        .real-chain-img {
            height: 100%;
            width: auto;
            object-fit: contain;
            animation: chainSoftPulse 4s ease-in-out infinite;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        @keyframes chainSoftPulse {
            0%, 100% {
                filter: brightness(1.0) drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
            50% {
                filter: brightness(1.2) drop-shadow(0 0 12px rgba(255, 240, 180, 0.5));
            }
        }

        .chain-1-img { animation-delay: 0.2s; animation-duration: 3.5s; }
        .chain-2-img { animation-delay: 1.8s; animation-duration: 4.2s; }
        .chain-3-img { animation-delay: 0.7s; animation-duration: 3.8s; }
        .chain-4-img { animation-delay: 2.3s; animation-duration: 4.5s; }
        .chain-5-img { animation-delay: 1.1s; animation-duration: 3.2s; }
        .chain-6-img { animation-delay: 2.9s; animation-duration: 4.0s; }
        .chain-7-img { animation-delay: 0.4s; animation-duration: 3.6s; }

        .crystal-chain-wrapper:hover .real-chain-img {
            transform: scale(1.06);
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.95)) !important;
        }

        /* Vầng sáng tỏa khi hover ôm khít viên đá chính ở đuôi dưới cùng */
        .glow-aura {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,215,0,0.55) 45%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: -1;
        }

        .crystal-chain-wrapper:hover .glow-aura {
            opacity: 1;
            animation: pulseAura 1.5s infinite alternate;
        }

        @keyframes pulseAura {
            0% { transform: translateX(-50%) scale(0.85); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(1.35); opacity: 1; }
        }

        /* Nhãn tên: Đẩy lên cao hẳn phía trên chữ LIN LYNN, siêu nhỏ gọn, tịnh tiến ngang ĐÚNG CHIỀU theo nhịp lắc của sợi dây */
        .crystal-label-container {
            position: absolute;
            bottom: 20vh;
            z-index: 20;
            pointer-events: none;
            transform: translateX(-50%);
            /* Độ lệch ngang do JavaScript tính từng khung hình theo điểm cuối sợi dây (followLabels) */
            will-change: transform;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .crystal-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4a3b32;
            background: rgba(255, 255, 255, 0.95);
            padding: 3px 8px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .crystal-label-container.visible .crystal-label {
            opacity: 1;
        }

        /* Hiệu ứng sao lấp lánh */
        .sparkle-star {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            animation: starBlink 3s ease-in-out infinite;
        }

        .sparkle-star::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffffff 25%, #fff3b0 65%, #ffd700 100%);
            clip-path: polygon(50% 0%, 57% 43%, 100% 50%, 57% 57%, 50% 100%, 43% 57%, 0% 50%, 43% 43%);
            filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 25px rgba(255,255,255,0.8));
        }

        @keyframes starBlink {
            0%, 100% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            30% { transform: scale(1.1) rotate(40deg); opacity: var(--star-max-opacity, 0.9); }
            50% { transform: scale(0.5) rotate(70deg); opacity: 0.3; }
            70% { transform: scale(1.4) rotate(90deg); opacity: var(--star-max-opacity, 1); }
        }

        .star-1 { top: 35%; left: 30%; }
        .star-2 { top: 65%; right: 25%; transform: scale(0.7); }

        /* Vùng click khoảng trống ngoài lề */
        .side-click-left, .side-click-right {
            position: absolute;
            top: 0;
            width: 12%;
            height: 100%;
            z-index: 8;
            cursor: pointer;
        }
        .side-click-left { left: 0; }
        .side-click-right { right: 0; }

        /* ==================== TRANG CON DỰ ÁN ==================== */
        #project-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0c10;
            z-index: 100;
            display: flex;
            flex-direction: column;

            overflow: hidden;

        #project-page.active {

            transform: scale(1);

        .project-bg-texture {

            background: radial-gradient(circle at center, rgba(15, 17, 25, 0.78) 0%, rgba(7, 8, 12, 0.96) 100%), 
                        url('room_bg.jpg') no-repeat center center;
            background-size: cover;
            backdrop-filter: blur(20px);
            pointer-events: none;
            z-index: 1;
        }

        #project-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .project-header {
            position: relative;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }

        .project-title-area h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.3rem;
            color: #f7ede2;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .project-title-area p {
            font-size: 0.8rem;
            color: #b3a598;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.85) 0%, rgba(243, 229, 171, 0.95) 100%);
            color: #121318;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 24px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            background: #ffffff;
        }

        #project-three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: grab;
        }

        #project-three-container:active {
            cursor: grabbing;
        }

        .card-label-overlay {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: #ffd700;
            letter-spacing: 3px;

            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card-label-overlay.active {
            opacity: 1;
        }

    <script>
        // Danh sách 7 sợi charm trên băng chuyền vòng tròn
        const chainsData = [
            { id: 'drop_purple', name: 'Giọt Nước Tím', img: 'Layer 2.png' },     // 0
            { id: 'moon', name: 'Trăng Khuyết Tím', img: 'Layer 1.png' },          // 1
            { id: 'sphere', name: 'Quả Cầu Pha Lê', img: 'Layer 3.png' },       // 2
            { id: 'sun', name: 'Mặt Trời Vàng', img: 'Layer 8.png' },              // 3
            { id: 'teardrop', name: 'Giọt Ngọc Aquamarine', img: 'Layer 5.png' }, // 4
            { id: 'heart', name: 'Trái Tim Hồng', img: 'Layer 7.png' },            // 5
            { id: 'star', name: 'Ngôi Sao Pha Lê', img: 'Layer 9.png' }           // 6
        ];

        let currentOffset = 0;
        let isTransitioning = false;

        // Định nghĩa 7 vị trí 3D trên băng chuyền vòng tròn (Parallax 3D thực thụ: tọa độ X, độ sâu Z, scale, brightness, blur, opacity)
        const slotConfigs = [
            { left: 18, zIndex: 3, scale: 0.72, brightness: 0.8, blur: 1.5, opacity: 0.75, isFront: false }, // Sợi 1 (Dài hơn sợi 3,5 và ngắn hơn sợi 2)
            { left: 30, zIndex: 6, scale: 0.90, brightness: 1.0, blur: 0, opacity: 1.0, isFront: true  }, // Sợi 2 (Dài)
            { left: 42, zIndex: 4, scale: 0.62, brightness: 0.6, blur: 3, opacity: 0.50, isFront: false }, // Sợi 3 (Ngắn nhất)
            { left: 50, zIndex: 7, scale: 1.00, brightness: 1.1, blur: 0, opacity: 1.0, isFront: true  }, // Sợi 4 (Dài nhất - chính giữa)
            { left: 58, zIndex: 4, scale: 0.62, brightness: 0.6, blur: 3, opacity: 0.50, isFront: false }, // Sợi 5 (Ngắn nhất)
            { left: 70, zIndex: 6, scale: 0.90, brightness: 1.0, blur: 0, opacity: 1.0, isFront: true  }, // Sợi 6 (Dài)
            { left: 82, zIndex: 3, scale: 0.72, brightness: 0.8, blur: 1.5, opacity: 0.75, isFront: false }  // Sợi 7 (Dài hơn sợi 3,5 và ngắn hơn sợi 6)
        ];

        const SLOT_COUNT = slotConfigs.length;
        const STEP_MS = 800;     // thời gian mỗi sợi đi hết 1 nấc
        const STAGGER_MS = 60;   // độ trễ giữa các sợi để xoay lần lượt từng sợi một
        const TILT_DEG = 18;     // độ nghiêng phối cảnh khi sợi dây đang di chuyển

        // Thứ tự các slot trên vòng tròn: hàng trước 1 → 2 → 4 → 6 → 7, rồi vòng ra hàng sau 7 → 5 → 3 → 1
        // (xoay ngược lại: 7 → 6 → 4 → 2 → 1 → 3 → 5)
        const RING = [0, 1, 3, 5, 6, 4, 2];

        // Mỗi sợi dây giữ 1 phần tử DOM cố định và 1 vị trí liên tục trên vòng RING (0..6, có phần lẻ khi đang xoay)
        const chainEls = [];
        const chainPos = chainsData.map((_, d) => RING.indexOf(d));

        const wrapSlot = (n) => ((n % SLOT_COUNT) + SLOT_COUNT) % SLOT_COUNT;
        const currentSlot = (d) => RING[wrapSlot(Math.round(chainPos[d]))];
        const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        // Nội suy thông số 3D giữa 2 slot liền kề trên vòng RING
        function slotStateAt(p) {
            const base = Math.floor(p);
            const t = p - base;
            const a = slotConfigs[RING[wrapSlot(base)]];
            const b = slotConfigs[RING[wrapSlot(base + 1)]];
            const lerp = (x, y) => x + (y - x) * t;

            return {
                left: lerp(a.left, b.left),
                scale: lerp(a.scale, b.scale),
                brightness: lerp(a.brightness, b.brightness),
                blur: lerp(a.blur, b.blur),
                opacity: lerp(a.opacity, b.opacity)
            };
        }

        function applyChain(d, tilt = 0) {
            const s = slotStateAt(chainPos[d]);
            const el = chainEls[d];
            el.style.left = s.left + '%';
            el.style.height = (s.scale * 75) + 'vh';
            el.style.filter = `brightness(${s.brightness}) blur(${s.blur}px)`;
            el.style.opacity = s.opacity;
            // Sợi càng to (càng gần) thì nằm càng trên
            el.style.zIndex = Math.round(s.scale * 100);
            el.style.transform = `translateX(-50%) perspective(1000px) rotateY(${tilt}deg)`;
        }

        function settleChain(d) {
            const slot = slotConfigs[currentSlot(d)];
            chainEls[d].style.setProperty('--star-max-opacity', slot.isFront ? 1 : 0.35);
            applyChain(d, 0);
        }

        function initChains() {
            const container = document.getElementById('chains-container');
            container.innerHTML = '';

            chainsData.forEach((chain, d) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'crystal-chain-wrapper';

                wrapper.onclick = (e) => {
                    e.stopPropagation();
                    if (isTransitioning) return;

                    const i = currentSlot(d);
                    if (!slotConfigs[i].isFront) {
                        if (i === 0 || i === 2) {
                            shiftChains(1);
                        } else if (i === 4 || i === 6) {
                            shiftChains(-1);
                        }
                    } else {
                        openProject(chain.id);
                    }
                };

                wrapper.innerHTML = `
                    <div class="chain-sway swaying">
                        <div class="glow-aura"></div>
                        <div class="sparkle-star star-1"></div>
                        <div class="sparkle-star star-2"></div>
                        <img src="${chain.img}" alt="${chain.name}" class="real-chain-img chain-${d + 1}-img">
                    </div>
                `;

                container.appendChild(wrapper);
                chainEls[d] = wrapper;
                settleChain(d);
            });
        }

        // Tỉ lệ nhãn chạy theo điểm cuối sợi dây (1 = đi đúng bằng viên đá, nhỏ hơn = biên độ nhẹ hơn)
        const LABEL_FOLLOW = 0.6;
        // Các nhãn đang hiển thị, mỗi nhãn gắn với sợi dây d phía trên nó
        let labelEls = [];

        // Render nhãn tên ở các slot phía trước (2, 4, 6), căn chuẩn tâm và tịnh tiến đúng chiều dao động
        function renderLabels(showLabels = true) {
            const labelsContainer = document.getElementById('labels-container');
            labelsContainer.innerHTML = '';
            labelEls = [];

            chainsData.forEach((chain, d) => {
                const slot = slotConfigs[currentSlot(d)];
                if (!slot.isFront) return;

                const labelDiv = document.createElement('div');
                labelDiv.className = `crystal-label-container ${showLabels ? 'visible' : ''}`;
                labelDiv.style.left = slot.left + '%';
                labelDiv.innerHTML = `<div class="crystal-label">${chain.name}</div>`;
                labelsContainer.appendChild(labelDiv);
                labelEls.push({ el: labelDiv, d });
            });
        }

        /* Nhãn tịnh tiến trái/phải theo đúng vị trí điểm cuối sợi dây đá ở từng khung hình:
           đá lắc về phía nào nhãn chạy về phía đó, đá đi nhanh thì nhãn đi nhanh */
        function followLabels() {
            labelEls.forEach(({ el, d }) => {
                const sway = chainEls[d] && chainEls[d].querySelector('.chain-sway');
                if (!sway) return;
                const t = getComputedStyle(sway).transform;
                // Xoay quanh đỉnh sợi dây: điểm cuối (0, h) lệch ngang một đoạn c * h
                const endX = t && t !== 'none' ? new DOMMatrixReadOnly(t).c * sway.offsetHeight : 0;
                el.style.transform = `translateX(-50%) translateX(${(endX * LABEL_FOLLOW).toFixed(2)}px)`;
            });
            requestAnimationFrame(followLabels);
        }

        /* Xoay vòng tròn phối cảnh 3D đúng 1 nấc: từng sợi lần lượt đi sang slot kế tiếp rồi dừng lại */
        function shiftChains(direction) {
            if (isTransitioning) return;
            isTransitioning = true;

            // Ẩn nhãn tên khi băng chuyền bắt đầu xoay chuyển
            renderLabels(false);

            currentOffset = (currentOffset + direction + SLOT_COUNT) % SLOT_COUNT;

            const starts = chainPos.slice();
            // Sợi đi đầu theo hướng xoay khởi hành trước, các sợi sau nối tiếp
            const order = chainsData.map((_, d) => d)
                .sort((a, b) => (currentSlot(b) - currentSlot(a)) * direction);
            const total = STEP_MS + STAGGER_MS * (order.length - 1);
            const startTime = performance.now();

            function frame(now) {
                const elapsed = now - startTime;

                order.forEach((d, k) => {
                    const t = Math.min(1, Math.max(0, (elapsed - k * STAGGER_MS) / STEP_MS));
                    chainPos[d] = starts[d] + direction * easeInOutCubic(t);
                    // Hàng trước và hàng sau đi ngược chiều nhau, nên nghiêng theo hướng đi thật trên màn hình
                    const dx = slotStateAt(starts[d] + direction).left - slotStateAt(starts[d]).left;
                    applyChain(d, -Math.sign(dx) * TILT_DEG * Math.sin(Math.PI * t));
                });

                if (elapsed < total) {
                    requestAnimationFrame(frame);
                    return;
                }

                // Dừng đúng tại slot mới rồi hiện lại nhãn tên
                order.forEach((d) => {
                    chainPos[d] = wrapSlot(starts[d] + direction);
                    settleChain(d);
                });
                renderLabels(true);
                isTransitioning = false;
            }

            requestAnimationFrame(frame);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initChains();
            renderLabels(true);
            requestAnimationFrame(followLabels);
        });

        /* Particles Rơi Chầm Chậm Cho Trang Chủ */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        for (let i = 0; i < 90; i++) {
            particles.push({
                x: canvas.width / 2 + (Math.random() - 0.5) * 500,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.2 + 0.5,
                color: Math.random() > 0.5 ? 'rgba(255, 230, 150, ' : (Math.random() > 0.5 ? 'rgba(255, 180, 230, ' : 'rgba(180, 240, 255, '),
                alpha: Math.random() * 0.8 + 0.2,
                vx: (Math.random() - 0.5) * 0.3,
                vy: Math.random() * 0.5 + 0.2,
                pulse: Math.random() * 0.03 + 0.01
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha += Math.sin(Date.now() * p.pulse) * 0.008;

                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = canvas.width / 2 + (Math.random() - 0.5) * 400;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + Math.max(0.1, Math.min(1, p.alpha)) + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#fff';
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* Particles Rơi Nhẹ Trên Trang Con */
        const projCanvas = document.getElementById('project-particles');
        const projCtx = projCanvas.getContext('2d');
        let projParticles = [];

        function resizeProjCanvas() {
            projCanvas.width = window.innerWidth;
            projCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeProjCanvas);
        resizeProjCanvas();

        for (let i = 0; i < 70; i++) {
            projParticles.push({
                x: Math.random() * projCanvas.width,
                y: Math.random() * projCanvas.height,
                radius: Math.random() * 1.8 + 0.4,
                color: Math.random() > 0.4 ? 'rgba(255, 215, 0, ' : 'rgba(255, 255, 255, ',
                alpha: Math.random() * 0.7 + 0.2,
                vy: Math.random() * 0.25 + 0.1,
                vx: (Math.random() - 0.5) * 0.15
            });
        }

        function animateProjParticles() {
            projCtx.clearRect(0, 0, projCanvas.width, projCanvas.height);
            projParticles.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;

                if (p.y > projCanvas.height) {
                    p.y = 0;
                    p.x = Math.random() * projCanvas.width;
                }

                projCtx.beginPath();
                projCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                projCtx.fillStyle = p.color + p.alpha + ')';
                projCtx.shadowBlur = 6;
                projCtx.shadowColor = '#ffd700';
                projCtx.fill();
            });
            requestAnimationFrame(animateProjParticles);
        }
        animateProjParticles();

        function openProject(key) {

    <script type="module">
        import * as THREE from 'three';

        const glslNoise3D = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));

                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);

                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            float fbm(vec3 p) {
                float value = 0.0;
                float amplitude = 0.5;
                float frequency = 1.0;
                for (int i = 0; i < 4; i++) {
                    value += amplitude * snoise(p * frequency);
                    frequency *= 2.05;
                    amplitude *= 0.5;
                }
                return value;
            }
        `;

        const glslSpectralPalette = `
            vec3 spectralPalette(float t, float dispersion) {
                vec3 a = vec3(0.70, 0.75, 0.80);
                vec3 b = vec3(0.35, 0.30, 0.35) * dispersion;
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.00, 0.20, 0.50) + vec3(0.1, 0.2, 0.3) * t;

                vec3 color = a + b * cos(6.28318 * (c * t + d));
                color = mix(color, vec3(0.92, 0.75, 0.95), sin(t * 3.1415) * 0.3);
                color = mix(color, vec3(0.55, 0.90, 0.95), cos(t * 3.1415) * 0.3);
                color = mix(color, vec3(0.98, 0.88, 0.70), sin((t + 0.5) * 3.1415) * 0.25);
                return max(color, vec3(0.0));
            }
        `;

        const beamVertexShader = `
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying vec2 vUv;
            varying vec3 vLocalPosition;

            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vLocalPosition = position;
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const beamFragmentShader = `
            uniform float uTime;
            uniform float uBeamIntensity;
            uniform float uDispersion;
            uniform float uLightSpread;
            uniform float uSpeed;

            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying vec2 vUv;
            varying vec3 vLocalPosition;

            ${glslNoise3D}
            ${glslSpectralPalette}

            void main() {
                float heightFactor = clamp(1.0 - vUv.y, 0.0, 1.0);
                vec2 rayCenter = vLocalPosition.xz;
                float distFromCenter = length(rayCenter);

                float time = uTime * uSpeed * 0.15;
                vec3 noiseCoord = vec3(vLocalPosition.x * 0.8, vLocalPosition.y * 0.4 - time, vLocalPosition.z * 0.8);
                
                float rayNoise = fbm(noiseCoord);
                float rayNoise2 = snoise(vec3(noiseCoord.xz * 2.5, time * 0.5));

                float angularRays = sin(atan(vLocalPosition.z, vLocalPosition.x) * 12.0 + rayNoise * 4.0 + time);
                angularRays = smoothstep(-0.2, 0.8, angularRays);

                float coneRadius = heightFactor * uLightSpread * 4.5 + 0.3;
                float coreDensity = smoothstep(coneRadius, 0.0, distFromCenter);
                float rayDetails = smoothstep(0.3, 1.0, rayNoise * 0.5 + 0.5 + angularRays * 0.3);
                
                float spectralPos = fract(distFromCenter * 0.25 - heightFactor * 0.4 + rayNoise2 * 0.2 + time * 0.1);
                vec3 spectralColor = spectralPalette(spectralPos, uDispersion);

                float coreMask = smoothstep(coneRadius * 0.4, 0.0, distFromCenter);
                vec3 finalBeamColor = mix(spectralColor, vec3(1.0, 0.98, 0.95), coreMask * 0.7);

                vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                float rim = 1.0 - abs(dot(viewDir, vNormal));
                float fresnel = pow(rim, 2.0);

                float alpha = coreDensity * (0.35 + rayDetails * 0.65) * pow(heightFactor, 0.3) * uBeamIntensity;
                alpha *= (0.6 + fresnel * 0.4);
                alpha *= smoothstep(0.0, 0.08, vUv.y) * smoothstep(1.0, 0.9, vUv.y);

                gl_FragColor = vec4(finalBeamColor * alpha, alpha);
            }
        `;

        class Application {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.clock = new THREE.Clock();

                this.params = {
                    beamIntensity: 0.8,
                    dispersion: 2.0,

                };

                this.initScene();
                this.initLightPrism();

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            initScene() {
                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    powerPreference: "high-performance",
                    alpha: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.container.appendChild(this.renderer.domElement);

                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 0, 11.5);
                this.camera.lookAt(0, -0.5, 0);

                window.addEventListener('resize', () => {
                    const width = window.innerWidth;
                    const height = window.innerHeight;
                    this.camera.aspect = width / height;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(width, height);
                });
            }

            initLightPrism() {
                const coneGeo = new THREE.CylinderGeometry(0.4, 3.8, 7.5, 64, 64, true);
                coneGeo.translate(0, -3.75, 0);

                this.beamUniforms = {
                    uTime: { value: 0 },
                    uBeamIntensity: { value: this.params.beamIntensity },
                    uDispersion: { value: this.params.dispersion },
                    uLightSpread: { value: this.params.lightSpread },
                    uSpeed: { value: this.params.speed }
                };

                const beamMat = new THREE.ShaderMaterial({
                    vertexShader: beamVertexShader,
                    fragmentShader: beamFragmentShader,
                    uniforms: this.beamUniforms,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });

                this.beamMesh = new THREE.Mesh(coneGeo, beamMat);
                this.beamMesh.position.set(0, 4.8, 0);
                this.scene.add(this.beamMesh);
            }

            animate() {
                requestAnimationFrame(this.animate);
                const elapsedTime = this.clock.getElapsedTime();
                this.beamUniforms.uTime.value = elapsedTime;
                this.renderer.render(this.scene, this.camera);
            }
        }

        class ThreeProjectCarousel {
            constructor() {
                this.container = document.getElementById('project-three-container');
                this.labelOverlay = document.getElementById('card-label-overlay');
                this.cards = [];
                this.textureLoader = new THREE.TextureLoader();

                this.mouse = new THREE.Vector2(-1000, -1000);
                this.targetMouse = new THREE.Vector2(0, 0);
                this.raycaster = new THREE.Raycaster();

                this.activeIndex = -1;

                this.initScene();
                this.initEvents();
                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            initScene() {
                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 0, 7.5);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.container.appendChild(this.renderer.domElement);

                this.frameTexture = this.textureLoader.load('khung.png');
            }

            initEvents() {
                window.addEventListener('resize', () => {
                    const width = window.innerWidth;
                    const height = window.innerHeight;
                    this.camera.aspect = width / height;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(width, height);
                });

                window.addEventListener('mousemove', (e) => {
                    this.targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                });

                this.container.addEventListener('click', () => {
                    if (this.hoveredIndex !== -1 && this.hoveredIndex !== undefined) {
                        if (this.activeIndex === this.hoveredIndex) {
                            this.activeIndex = -1;
                            this.labelOverlay.classList.remove('active');
                        } else {
                            this.activeIndex = this.hoveredIndex;
                            this.labelOverlay.innerText = this.cards[this.activeIndex].userData.title;
                            this.labelOverlay.classList.add('active');
                        }
                    } else {
                        this.activeIndex = -1;
                        this.labelOverlay.classList.remove('active');
                    }
                });
            }

            clear() {
                this.cards.forEach(cardGroup => {
                    this.scene.remove(cardGroup);
                    cardGroup.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    });
                });
                this.cards = [];
                this.activeIndex = -1;
                this.labelOverlay.classList.remove('active');
            }

            loadProject(items) {
                this.clear();
                const bgTexture = this.textureLoader.load('Layer 7.png');
    bgTexture.wrapS = THREE.RepeatWrapping;
    bgTexture.wrapT = THREE.RepeatWrapping;
    bgTexture.repeat.set(3, 3); // Lặp 3x3 để thu nhỏ các khối pha lê sắc sảo hơn

    const bgGeo = new THREE.PlaneGeometry(20, 12);
    const bgMat = new THREE.MeshBasicMaterial({ 
        map: bgTexture, 
        side: THREE.DoubleSide, 
        transparent: true, 
        opacity: 0.45 // Làm trầm nền xuống 45% để làm nổi bật nội dung chính
    });
    this.backgroundMesh = new THREE.Mesh(bgGeo, bgMat);
    this.backgroundMesh.position.set(0, 0, -3.0); // Đẩy lùi ra xa (Z = -3.0)
    this.scene.add(this.backgroundMesh);

                const frameWidth = 1.8;
                const frameHeight = 2.7;
                const frameGeo = new THREE.PlaneGeometry(frameWidth, frameHeight);

                const artWidth = 1.55; 
                const artHeight = 2.35;
                const artGeo = new THREE.PlaneGeometry(artWidth, artHeight);

                items.forEach((item, index) => {
                    const cardGroup = new THREE.Group();

                    const artTexture = this.textureLoader.load(item.img);
                    const artMaterial = new THREE.MeshBasicMaterial({
                        map: artTexture,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.8 // Mặc định giảm 20% độ mờ
                    });
                    const artMesh = new THREE.Mesh(artGeo, artMaterial);
                    artMesh.position.set(0, 0, 0.02);
                    cardGroup.add(artMesh);

                    const frameMaterial = new THREE.MeshBasicMaterial({
                        map: this.frameTexture,
                        transparent: true,
                        alphaTest: 0.1, // Thêm dòng này để loại bỏ lỗi xuyên thấu giữa các lớp khung
                        depthWrite: true, // Bật ghi chiều sâu để phân định trước sau rõ ràng
                        side: THREE.DoubleSide
                    });
                    const frameMesh = new THREE.Mesh(frameGeo, frameMaterial);
                    frameMesh.position.set(0, 0, 0);
                    cardGroup.add(frameMesh);

                    const total = items.length;
                    const spacing = 1.2; // Tăng khoảng cách ngang giữa các khung
                    const startX = -((total - 1) * spacing) / 2;

                    const defaultX = startX + index * spacing;
                    const defaultY = 0;
                    const defaultZ = 0; // Cho tất cả cùng một độ sâu Z để kích thước đều nhau tuyệt đối

                    const defaultRotY = -0.45;
                    const defaultRotX = 0; // Trục ngang = 0 để các khung song song, không bị tóp chân

                    cardGroup.position.set(defaultX, defaultY, defaultZ);
                    cardGroup.rotation.set(defaultRotX, defaultRotY, 0);

                    cardGroup.userData = {
                        index: index,
                        title: item.title,
                        defaultPos: new THREE.Vector3(defaultX, defaultY, defaultZ),
                        defaultRot: new THREE.Euler(defaultRotX, defaultRotY, 0),
                        hitMesh: frameMesh
                    };

                    this.scene.add(cardGroup);
                    this.cards.push(cardGroup);
                });
            }

            animate() {
                requestAnimationFrame(this.animate);

                this.mouse.x += (this.targetMouse.x - this.mouse.x) * 0.1;
                this.mouse.y += (this.targetMouse.y - this.mouse.y) * 0.1;

                if (this.cards.length > 0) {
                    this.raycaster.setFromCamera(this.targetMouse, this.camera);
                    const hitObjects = this.cards.map(c => c.userData.hitMesh);
                    const intersects = this.raycaster.intersectObjects(hitObjects);

                    if (intersects.length > 0) {
                        const hitMesh = intersects[0].object;
                        this.hoveredIndex = hitMesh.parent.userData.index;
                    } else {
                        this.hoveredIndex = -1;
                    }

// Cho ảnh nền dịch chuyển óng ánh ngẫu nhiên theo thời gian thực
if (this.backgroundMesh && this.backgroundMesh.material.map) {
    this.backgroundMesh.material.map.offset.x += 0.0003 * Math.sin(Date.now() * 0.0008);
    this.backgroundMesh.material.map.offset.y += 0.0002 * Math.cos(Date.now() * 0.0008);
}
                    this.cards.forEach((cardGroup, index) => {
                        const uData = cardGroup.userData;
                        const artMesh = cardGroup.children[0];
            const targetOpacity = (this.activeIndex === index) ? 1.0 : 0.8;
            artMesh.material.opacity += (targetOpacity - artMesh.material.opacity) * 0.1;

            let targetX = uData.defaultPos.x;
            let targetY = uData.defaultPos.y;
            let targetZ = uData.defaultPos.z;

                        let targetRotX = uData.defaultRot.x;
                        let targetRotY = uData.defaultRot.y;
                        let targetRotZ = 0;

                        if (this.activeIndex !== -1) {
                            if (index === this.activeIndex) {
                                targetX = 0;
                                targetY = 0;
                                targetZ = 2.2;
                                targetRotX = this.mouse.y * 0.15;
                                targetRotY = this.mouse.x * 0.15;
                            } else {
                                // Tách vị trí các khung phía sau ra để chúng không bị đè khít lên nhau
                                const offset = index - this.activeIndex;
                                targetX = (index < this.activeIndex) ? (-3.2 + offset * 0.4) : (3.2 + offset * 0.4);
                                targetZ = -1.5 - Math.abs(offset) * 0.2;
                            }
                        }

                        cardGroup.position.x += (targetX - cardGroup.position.x) * 0.1;
                        cardGroup.position.y += (targetY - cardGroup.position.y) * 0.1;
                        cardGroup.position.z += (targetZ - cardGroup.position.z) * 0.1;

                        cardGroup.rotation.x += (targetRotX - cardGroup.rotation.x) * 0.1;
                        cardGroup.rotation.y += (targetRotY - cardGroup.rotation.y) * 0.1;
                        cardGroup.rotation.z += (targetRotZ - cardGroup.rotation.z) * 0.1;
                    });
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new Application();
            window.projectCarousel = new ThreeProjectCarousel();
        });
